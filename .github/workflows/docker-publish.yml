name: Publish fork image

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-fork-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'gzeoneth/UniFi-Insights-Plus' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - name: Validate custom version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\n' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-gzeon\.[0-9]+$ ]]; then
            echo 'VERSION must use X.Y.Z-gzeon.N' >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gzeoneth/unifi-insights-plus:${{ steps.version.outputs.value }}
            ghcr.io/gzeoneth/unifi-insights-plus:gzeon
            ghcr.io/gzeoneth/unifi-insights-plus:sha-${{ env.BUILD_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
